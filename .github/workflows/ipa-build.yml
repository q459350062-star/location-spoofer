
name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ipa-build.yml'
      - 'App/**'
      - 'Core/**'
      - 'Shared/**'
      - 'Resources/**'
      - 'ThirdParty/WlocScripts/**'
      - 'Config/**'
      - 'Scripts/**'
      - 'Tests/**'
      - 'project.yml'
      - 'build.sh'
      - 'Makefile'

permissions:
  contents: read

concurrency:
  group: ipa-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Check environment
        run: |
          xcodebuild -version
          swift --version
          go version

      - name: Run contract tests
        run: ./Tests/run_all_contract_tests.sh

      - name: Build IPA
        run: ./build.sh

      - name: Run iPhone simulator tests
        run: |
          AVAILABLE_DEVICES="$(xcrun simctl list devices available)"
          if printf '%s' "$AVAILABLE_DEVICES" | grep -Fq 'iPhone 12 Pro Max ('; then
            DESTINATION='platform=iOS Simulator,name=iPhone 12 Pro Max'
          else
            echo "::warning::iPhone 12 Pro Max simulator is unavailable on this Xcode image; using iPhone 16 simulator."
            DESTINATION='platform=iOS Simulator,name=iPhone 16'
          fi
          echo "Simulator destination: $DESTINATION"
          xcodebuild \
            -project PaopaoLocationSpoofer.xcodeproj \
            -scheme PaopaoLocationSpoofer \
            -destination "$DESTINATION" \
            test

      - name: Verify IPA
        run: |
          test -s dist/PaopaoLocationSpoofer-unsigned.ipa
          unzip -t dist/PaopaoLocationSpoofer-unsigned.ipa
          ls -lh dist/*.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Location-Spoofer-unsigned-IPA
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14
