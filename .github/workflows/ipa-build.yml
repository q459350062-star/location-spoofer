
name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ipa-build.yml'
      - 'App/**'
      - 'Core/**'
      - 'Shared/**'
      - 'Resources/**'
      - 'ThirdParty/WlocScripts/**'
      - 'ThirdParty/wloc/**'
      - 'Config/**'
      - 'Scripts/**'
      - 'Tests/**'
      - 'project.yml'
      - 'build.sh'
      - 'Makefile'

permissions:
  contents: read

concurrency:
  group: ipa-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Check environment
        run: |
          xcodebuild -version
          swift --version
          go version

      - name: Run contract tests
        run: ./Tests/run_all_contract_tests.sh

      - name: Build IPA
        run: ./build.sh

      - name: Run available iPhone simulator tests
        continue-on-error: true
        run: |
          SIMULATOR_ID="$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"], text=True
          ))
          iphones = [
              d for runtime in devices["devices"].values() for d in runtime
              if d.get("isAvailable") and d.get("name", "").startswith("iPhone")
          ]
          preferred = ["iPhone 12 Pro Max", "iPhone 17 Pro Max", "iPhone 17 Pro", "iPhone 17", "iPhone 16"]
          iphones.sort(key=lambda d: (preferred.index(d["name"]) if d["name"] in preferred else len(preferred), d["name"]))
          print(iphones[0]["udid"] if iphones else "")
          PY
          )"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "::warning::No iPhone simulator runtime is installed; simulator tests skipped."
            exit 0
          fi
          echo "Simulator UDID: $SIMULATOR_ID"
          xcodebuild \
            -project PaopaoLocationSpoofer.xcodeproj \
            -scheme PaopaoLocationSpoofer \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            test

      - name: Verify IPA
        run: |
          test -s dist/PaopaoLocationSpoofer-unsigned.ipa
          unzip -t dist/PaopaoLocationSpoofer-unsigned.ipa
          ls -lh dist/*.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Location-Spoofer-unsigned-IPA
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14
