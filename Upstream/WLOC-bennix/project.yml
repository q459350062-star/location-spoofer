name: WLOC

options:
  bundleIdPrefix: fudan.miniS
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WLOC:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fudan.miniS.WLOC
        PRODUCT_NAME: WLOC
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/location-spoofer.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - target: WLOCTunnel
        embed: true
        codeSign: true

  WLOCTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
      - path: GoSpoofer
        excludes:
          - "**/*.go"
          - "**/*.sh"
          - "build/**"
          - go.mod
          - go.sum
          - CGoLocationSpoofer.modulemap
          - libgolocationspoofer.a
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fudan.miniS.WLOC.tunnel
        PRODUCT_NAME: WLOCTunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/location-spoofer-tunnel.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/GoSpoofer"
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/location-spoofer-tunnel-Bridging-Header.h
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lgolocationspoofer"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/GoSpoofer/build"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    dependencies:
      - sdk: NetworkExtension.framework

  WLOCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WLOCTests
    dependencies:
      - target: WLOC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fudan.miniS.WLOCTests
        GENERATE_INFOPLIST_FILE: YES

  WLOCUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WLOCUITests
    dependencies:
      - target: WLOC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fudan.miniS.WLOCUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WLOC:
    build:
      targets:
        WLOC: all
        WLOCTunnel: all
        WLOCTests: [test]
        WLOCUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WLOCTests
        - WLOCUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
